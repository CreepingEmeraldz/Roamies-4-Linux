# Accessibility helper for Roamies on Linux (read only): lists the open windows and reads a window's controls and text
# over AT-SPI, the accessibility bus GTK, Qt, Firefox and Chromium apps publish to. The twin of the hands helpers on
# macOS and Windows for `windows` and `ui`, with the same JSON. Built by build.sh, bundled as binaries/roamies-atspi-<target>.
[package]
name = "roamies-atspi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
