# Pointer helper for Roamies on Linux Wayland compositors that can't tell an app where the pointer is (niri).
# Built by build.sh and bundled as binaries/roamies-pointer-<target>. See src/main.rs.
[package]
name = "roamies-pointer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
pipewire = "0.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
