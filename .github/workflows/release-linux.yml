# Linux-only release for this fork: tag a version (e.g. `git tag v0.1.44-linux1 && git push origin v0.1.44-linux1`) or
# run it by hand from the Actions tab (it then builds the version in tauri.conf.json and tags it v<version>-linux.N, N counting up).
# Builds the AppImage (plus .deb and .rpm) and attaches them to a published GitHub release, with latest.json so an
# AppImage can update itself. Needs the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets.
name: Release (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    # Ubuntu 24.04: ONNX Runtime's prebuilt library (the voice helper) needs glibc 2.38.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: showcase/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: showcase/tauri/sidecar
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            showcase/tauri/src-tauri -> target
            showcase/tauri/src-tauri/voice-win -> target
          key: x86_64-unknown-linux-gnu

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Tauri's Linux build dependencies, ALSA for the voice helper, gtk-layer-shell for the overlay, and patchelf with
      # the GStreamer plugins the AppImage bundles.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libgtk-layer-shell-dev libpipewire-0.3-dev clang patchelf libfuse2t64 gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      # A run by hand makes the next release of this version: v0.1.46-linux.1, then .2, and so on (the first run of a new
      # upstream version starts again at .1). A pushed tag is used as it is. The number goes into the app too, so it can
      # tell when a newer release is out.
      - name: Number this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json | head -1)"
          TAG="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            LAST="$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
              | sed -n "s/^v${VERSION//./\\.}-linux\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)"
            TAG="v${VERSION}-linux.$(( ${LAST:-0} + 1 ))"
          fi
          echo "Building $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ROAMIES_BUILD=${TAG#v}" >> "$GITHUB_ENV"

      # The build is signed with this fork's own key (the TAURI_SIGNING_* secrets) so an AppImage can update itself. The
      # app's version is set to the full release number, so it can tell when a newer one is out.
      - name: Build
        env:
          TAURI_BUNDLES: appimage,deb,rpm
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./build.sh release --target x86_64-unknown-linux-gnu --config "{\"version\":\"${TAG#v}\"}"

      # Each release keeps its number in its file names, and the newest is marked as the latest.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="${TAG#v}"
          echo "Releasing $TAG"
          B=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          mkdir -p out
          cp $B/appimage/*.AppImage "out/Roamies_${LABEL}_amd64.AppImage"
          cp $B/deb/*.deb "out/Roamies_${LABEL}_amd64.deb"
          cp $B/rpm/*.rpm "out/Roamies-${LABEL}.x86_64.rpm"
          cp $B/appimage/*.AppImage.sig "out/Roamies_${LABEL}_amd64.AppImage.sig"
          ls -la out
          PREV="$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' || true)"
          { cat "$GITHUB_WORKSPACE/.github/release-notes.md"; echo; echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/${PREV:-$TAG}...$TAG"; } > notes.md
          # A draft until every file is up, so nobody (the updater included) sees a release that is half there.
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Roamies $LABEL" --draft \
            --notes-file notes.md --target "$GITHUB_SHA"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/*
          # The feed the app's updater reads (the newest release's copy is at releases/latest/download/latest.json).
          SIG="$(cat "out/Roamies_${LABEL}_amd64.AppImage.sig")" LABEL="$LABEL" TAG="$TAG" REPO="$GITHUB_REPOSITORY" node -e '
            const e = process.env;
            const url = `https://github.com/${e.REPO}/releases/download/${e.TAG}/Roamies_${e.LABEL}_amd64.AppImage`;
            const p = { signature: e.SIG, url };
            const notes = require("fs").readFileSync("notes.md", "utf8");
            require("fs").writeFileSync("latest.json", JSON.stringify({ version: e.LABEL, notes, pub_date: new Date().toISOString(),
              platforms: { "linux-x86_64": p, "linux-x86_64-appimage": p } }, null, 2));
          '
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber latest.json
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
